name = "moation-ai"
main = "src/index.js"
compatibility_date = "2026-08-31"

# Custom domains (moation.ai, www.moation.ai) are attached out of band via the
# account-scoped /accounts/{id}/workers/domains/records endpoint and persist
# across deploys on their own. Do NOT declare them as `routes` here: wrangler
# then reconciles them through /zones/{id}/workers/routes, which this token has
# no zone permission for, and every deploy fails.

# Hourly. Cloudflare cron triggers fire close to the minute, unlike GitHub
# Actions schedules which drift. This covers the six free API sources; the X
# scraper runs separately, four times a day, from a Mac.
[triggers]
crons = ["7 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "moation"
database_id = "bc295c9a-db07-492b-b134-c331cafa0720"

[observability]
enabled = true

# Secrets (set with `wrangler secret put NAME`), all optional:
#   COLLECT_SECRET       guards /api/collect
#   BSKY_HANDLE          Bluesky search 403s unauthenticated from some networks
#   BSKY_APP_PASSWORD
#   REDDIT_CLIENT_ID     without these, Reddit falls back to old.reddit HTML
#   REDDIT_CLIENT_SECRET
#   GITHUB_TOKEN         raises the GitHub search rate limit
